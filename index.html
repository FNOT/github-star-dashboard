<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎮 게임 레포 Star 대시보드</title>
<style>
  :root {
    --bg: #0f1117; --card: #181b24; --line: #262a36; --text: #e8eaf0; --muted: #8a90a2; --faint: #3a3f4d;
    --gold: #f5c542; --silver: #c9ced8; --bronze: #d08a52; --up: #3ecf8e; --accent: #7c8cff;
    /* categorical series, dark steps (validated on #181b24) */
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 32px 20px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 26px; }
  h2 { margin: 0; font-size: 17px; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  button, select, input { background: var(--card); color: var(--text); border: 1px solid var(--line);
                   border-radius: 8px; padding: 7px 12px; font: inherit; }
  button, select { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); background: #232846; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .stat { padding: 14px 16px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* trend chart */
  .panel { padding: 18px 18px 14px; margin-bottom: 20px; }
  .panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
  .note { color: var(--muted); font-size: 12px; margin: 4px 0 10px; line-height: 1.5; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px;
          border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  .chip.on { color: var(--text); border-color: #3a4052; }
  #chartBox { position: relative; }
  #chart { display: block; width: 100%; height: 320px; }
  #chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .tip { position: absolute; pointer-events: none; background: #0b0d13; border: 1px solid var(--line);
         border-radius: 8px; padding: 8px 10px; font-size: 12px; min-width: 170px; display: none;
         box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 2; }
  .tip .t { color: var(--muted); margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
  .tip .r span:first-child { display: inline-flex; align-items: center; gap: 6px; }
  .tip .sw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
           color: var(--muted); font-size: 13px; text-align: center; padding: 20px; }

  /* ranking */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 44px 1fr 200px 90px; align-items: center; gap: 14px;
         background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px;
         text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
  .row:hover { border-color: var(--accent); transform: translateY(-1px); }
  .rank { font-size: 18px; font-weight: 700; text-align: center; color: var(--muted); }
  .r1 .rank { color: var(--gold); } .r2 .rank { color: var(--silver); } .r3 .rank { color: var(--bronze); }
  .title { font-weight: 600; font-size: 15px; line-height: 1.35; }
  .team { color: var(--accent); font-weight: 500; font-size: 13px; }
  .repo { color: var(--muted); font-size: 12px; margin-top: 3px; font-family: ui-monospace, Consolas, monospace; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold));
             border-radius: 99px; transition: width .6s ease; }
  .stars { text-align: right; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .delta { display: block; font-size: 12px; font-weight: 600; color: var(--up); min-height: 15px; }
  .flash { animation: flash 1.6s ease; }
  @keyframes flash { 0% { background: rgba(62, 207, 142, .25); } 100% { background: var(--card); } }
  .err { background: #3a1d22; border: 1px solid #6b2a33; color: #ffb3bd; border-radius: 10px;
         padding: 10px 14px; margin-bottom: 14px; font-size: 13px; display: none; }
  footer { color: var(--muted); font-size: 12px; margin-top: 20px; text-align: center; }
  @media (max-width: 640px) {
    .row { grid-template-columns: 32px 1fr 70px; }
    .bar { display: none; }
    #chart { height: 260px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🎮 게임 레포 Star 대시보드</h1>
      <div class="sub" id="updated">불러오는 중…</div>
    </div>
    <div class="controls">
      자동 새로고침
      <select id="interval">
        <option value="30">30초</option>
        <option value="60" selected>1분</option>
        <option value="300">5분</option>
        <option value="0">끄기</option>
      </select>
      <button id="refresh">↻ 지금 새로고침</button>
    </div>
  </header>

  <div class="err" id="err"></div>

  <div class="stats">
    <div class="stat"><div class="k">총 Star</div><div class="v" id="total">–</div></div>
    <div class="stat"><div class="k">1위</div><div class="v" id="leader" style="font-size:17px">–</div></div>
    <div class="stat"><div class="k">최근 24시간 증가</div><div class="v" id="gained">–</div></div>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>📈 Star 추이</h2>
      <div class="controls" id="ranges">
        <button data-range="3600000">1시간</button>
        <button data-range="86400000">24시간</button>
        <button data-range="604800000">7일</button>
        <button data-range="0" class="on">전체</button>
      </div>
    </div>
    <div class="note" id="sourceNote"></div>
    <div class="legend" id="legend"></div>
    <div id="chartBox">
      <svg id="chart" role="img" aria-label="레포별 누적 Star 추이"></svg>
      <div class="tip" id="tip"></div>
      <div class="empty" id="empty" style="display:none"></div>
    </div>
  </section>

  <div class="list" id="list"></div>

  <footer>GitHub API 기준 · 기록은 GitHub Actions가 약 10분마다 저장해서 어느 기기에서 열어도 같아요 · 초록색 숫자는 최근 24시간 동안 늘어난 Star 수예요</footer>
</div>

<script>
let REPOS = [];                            // loaded from repos.json
const KEY = r => r.repo.toLowerCase();
const SLOTS = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];
const MAX_HIGHLIGHT = SLOTS.length;
const LS = { hl: "starDash.highlight.v1", local: "starDash.local.v2" };
const GAP = 5 * 60000;                     // checks closer than this count as continuous recording
const LOCAL_KEEP = 8 * 86400000;           // keep this browser's own readings for 8 days

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const last = {};                           // stars at previous refresh
let shared = {};                           // { key: [[ms, stars], ...] } recorded by GitHub Actions
let sharedCoverage = [];                   // [[from, to], ...] when GitHub Actions was recording
let sharedUpdated = null;                  // time of the newest recorded point
// Readings this browser takes every minute while the page is open (same shape as shared).
let local = load(LS.local, { repos: {}, coverage: [] });
let highlight = load(LS.hl, null);         // { key: slotIndex } - color follows the repo, not its rank
let current = {};                          // latest { key: stars }
let range = 0;                             // 0 = all
let timer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const colorOf = k => highlight[k] != null ? `var(${SLOTS[highlight[k]]})` : null;

/* ---------- data ---------- */

// One search request returns all 13 repos, so frequent refreshes stay within
// GitHub's unauthenticated limit (10 search requests per minute).
async function fetchStars() {
  const q = REPOS.map(r => "repo:" + r.repo).join(" ");
  const res = await fetch("https://api.github.com/search/repositories?per_page=100&q=" + encodeURIComponent(q),
                          { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(`GitHub API ${res.status}: ${body.message || res.statusText}`);
  }
  const data = await res.json();
  const map = {};
  for (const item of data.items) map[item.full_name.toLowerCase()] = item.stargazers_count;
  return map;
}

async function loadRepos() {
  const res = await fetch("repos.json?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("repos.json을 불러오지 못했어요 (" + res.status + ")");
  REPOS = await res.json();
}

// Shared history written by the GitHub Actions recorder. Served from the same site,
// so every device sees the same data. Missing file = recorder hasn't run yet.
async function loadShared() {
  try {
    const res = await fetch("data/history.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    shared = data.repos || {};
    sharedCoverage = data.coverage || [];
    sharedUpdated = Math.max(0, ...sharedCoverage.map(c => c[1]), ...Object.values(shared).flat().map(p => p[0])) || null;
  } catch { /* keep the last copy */ }
}

// Extend the last coverage interval if this check follows it closely, else start a new one.
function addCoverage(list, t) {
  const lastI = list[list.length - 1];
  if (lastI && t >= lastI[0] && t - lastI[1] <= GAP) lastI[1] = Math.max(lastI[1], t);
  else list.push([t, t]);
}

// Union of coverage intervals; intervals within GAP of each other are joined.
function mergeCoverage(...lists) {
  const all = lists.flat().map(c => c.slice()).sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const c of all) {
    const lastI = out[out.length - 1];
    if (lastI && c[0] - lastI[1] <= GAP) lastI[1] = Math.max(lastI[1], c[1]);
    else out.push(c);
  }
  return out;
}

// Store this check: a point when a repo's count changed, and coverage for "someone was recording".
function recordLocal(map, now) {
  for (const r of REPOS) {
    const k = KEY(r), v = map[k];
    if (v == null) continue;
    const arr = local.repos[k] || (local.repos[k] = []);
    if (!arr.length || arr[arr.length - 1][1] !== v) arr.push([now, v]);
  }
  addCoverage(local.coverage, now);
  // drop old local readings (the shared history has them by then)
  const cutoff = now - LOCAL_KEEP;
  for (const k in local.repos) {
    const arr = local.repos[k];
    while (arr.length > 1 && arr[1][0] < cutoff) arr.shift();
  }
  local.coverage = local.coverage.filter(c => c[1] >= cutoff);
  save(LS.local, local);
}

// Step series for one repo: GitHub Actions records + this browser's readings + the live value.
function seriesFor(k) {
  const pts = [...(shared[k] || []), ...(local.repos[k] || [])].sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const p of pts) if (!out.length || out[out.length - 1][1] !== p[1]) out.push(p);
  const v = current[k];
  if (v != null && (!out.length || out[out.length - 1][1] !== v)) out.push([Date.now(), v]);
  return out;
}

const coverage = () => mergeCoverage(sharedCoverage, local.coverage);

// Stars gained in the last 24h: now minus the value 24h ago (or the first record if newer).
function gained24h(k) {
  const pts = seriesFor(k);
  if (!pts.length) return 0;
  const before = valueAt(pts, Date.now() - 86400000);
  return pts[pts.length - 1][1] - (before ?? pts[0][1]);
}

/* ---------- chart ---------- */

const fmtTime = (ms, span) => {
  const d = new Date(ms);
  if (span <= 2 * 86400000) return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  return d.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" });
};
const fmtFull = ms => new Date(ms).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });

function niceStep(max, ticks) {
  const raw = Math.max(1, max / ticks), p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  return Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p);
}

// value of a step series at time t (null before the first known point)
function valueAt(pts, t) {
  let v = null;
  for (const p of pts) { if (p[0] <= t) v = p[1]; else break; }
  return v;
}

let chartState = null;

function drawChart() {
  const svg = $("chart");
  const W = svg.clientWidth || 900, H = svg.clientHeight || 320;
  const m = { l: 36, r: 14, t: 12, b: 26 };
  const now = Date.now();
  const all = REPOS.map(r => ({ r, k: KEY(r), pts: seriesFor(KEY(r)) })).filter(s => s.pts.length);

  $("sourceNote").textContent = "이 페이지를 열어둔 동안에는 이 브라우저가 1분마다 직접 확인하고, 닫혀 있는 동안에는 GitHub Actions가 2분마다 기록해요 (사이트 반영은 최대 10분 지연)." +
    " 점선은 아무도 기록하지 않아 그 사이 변화를 모르는 구간이에요." +
    (sharedUpdated ? " (GitHub 마지막 기록: " + fmtFull(sharedUpdated) + ")" : "") +
    " 위 칩을 누르면 강조할 팀을 바꿀 수 있어요 (최대 8팀).";

  const minT = all.length ? Math.min(...all.map(s => s.pts[0][0])) : now;
  let x0 = range ? now - range : minT;
  if (now - x0 < 60000) x0 = now - 60000;
  const x1 = now;
  const span = x1 - x0;

  // y max among values visible in the window
  let yMax = 1;
  for (const s of all) {
    for (const p of s.pts) if (p[0] >= x0) yMax = Math.max(yMax, p[1]);
    const v = valueAt(s.pts, x0); if (v != null) yMax = Math.max(yMax, v);
  }
  const step = niceStep(yMax, 4);
  yMax = Math.ceil(yMax / step) * step;

  const X = t => m.l + ((t - x0) / span) * (W - m.l - m.r);
  const Y = v => m.t + (1 - v / yMax) * (H - m.t - m.b);

  let g = "";
  // grid + y labels
  for (let v = 0; v <= yMax; v += step) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${m.l - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  // x labels
  const nx = Math.max(2, Math.floor((W - m.l - m.r) / 110));
  for (let i = 0; i <= nx; i++) {
    const t = x0 + (span * i) / nx;
    g += `<text x="${X(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nx ? "end" : "middle"}">${fmtTime(t, span)}</text>`;
  }

  const path = pts => {
    // clip to window: start at value at x0 if a point exists before the window
    let start = valueAt(pts, x0), d = "";
    const inWin = pts.filter(p => p[0] > x0);
    if (start != null) d = `M${X(x0)},${Y(start)}`;
    let prev = start;
    for (const p of inWin) {
      d += d ? `H${X(p[0])}` : `M${X(p[0])},${Y(p[1])}`;
      if (prev != null) d += `V${Y(p[1])}`;
      prev = p[1];
    }
    if (prev != null) d += `H${X(x1)}`;
    return d;
  };

  // Solid only where someone was recording; elsewhere the dashed underlay shows through,
  // so a flat stretch with no data isn't mistaken for "no change".
  const cov = coverage().filter(c => c[1] >= x0);
  g += `<defs><clipPath id="covClip">` +
       cov.map(c => { const a = Math.max(X(c[0]), m.l) - 2, b = Math.min(X(c[1]), W - m.r) + 2;
                      return `<rect x="${a}" y="0" width="${Math.max(0, b - a)}" height="${H}"/>`; }).join("") +
       `</clipPath></defs>`;
  const line = (d, color, width) =>
    `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-dasharray="3 4" opacity=".6"/>` +
    `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linejoin="round" clip-path="url(#covClip)"/>`;

  // muted repos first, highlighted on top
  const muted = all.filter(s => highlight[s.k] == null), hot = all.filter(s => highlight[s.k] != null);
  for (const s of muted) g += line(path(s.pts), "var(--faint)", 1.5);
  for (const s of hot) {
    g += line(path(s.pts), colorOf(s.k), 2);
    const v = s.pts[s.pts.length - 1][1];
    g += `<circle cx="${X(x1)}" cy="${Y(v)}" r="4" fill="${colorOf(s.k)}" stroke="var(--card)" stroke-width="2"/>`;
  }
  g += `<line id="cross" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = g;

  const empty = $("empty");
  if (!all.length) { empty.style.display = "flex"; empty.textContent = "아직 기록이 없어요. 잠시 후 첫 기록이 쌓여요."; }
  else empty.style.display = "none";

  chartState = { X, Y, x0, x1, m, W, H, all, hot };
}

function onHover(ev) {
  if (!chartState) return;
  const { x0, x1, m, W, H, all } = chartState;
  const svg = $("chart"), rect = svg.getBoundingClientRect();
  const px = ((ev.clientX - rect.left) / rect.width) * W;
  if (px < m.l || px > W - m.r) return hideTip();
  const t = x0 + ((px - m.l) / (W - m.l - m.r)) * (x1 - x0);
  const rows = all.map(s => ({ s, v: valueAt(s.pts, t) })).filter(o => o.v != null)
                  .sort((a, b) => (highlight[b.s.k] != null) - (highlight[a.s.k] != null) || b.v - a.v);
  const shown = rows.filter(o => highlight[o.s.k] != null);
  const others = rows.length - shown.length;
  const cross = $("cross");
  cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.style.display = "";
  const tip = $("tip");
  tip.innerHTML = `<div class="t">${fmtFull(t)}</div>` +
    shown.map(o => `<div class="r"><span><i class="sw" style="background:${colorOf(o.s.k)}"></i>${esc(o.s.r.short)}</span><b>★ ${o.v}</b></div>`).join("") +
    (others ? `<div class="t" style="margin:4px 0 0">그 외 ${others}팀 (회색)</div>` : "");
  tip.style.display = "block";
  const bx = $("chartBox").getBoundingClientRect();
  let left = ev.clientX - bx.left + 14;
  if (left + tip.offsetWidth > bx.width) left = ev.clientX - bx.left - tip.offsetWidth - 14;
  tip.style.left = left + "px";
  tip.style.top = Math.max(0, ev.clientY - bx.top - tip.offsetHeight / 2) + "px";
}
function hideTip() { $("tip").style.display = "none"; const c = $("cross"); if (c) c.style.display = "none"; }

function renderLegend() {
  $("legend").innerHTML = REPOS.map(r => {
    const k = KEY(r), on = highlight[k] != null;
    return `<button class="chip${on ? " on" : ""}" data-k="${esc(k)}" title="${esc(r.title)} · ${esc(r.team)}">
      <span class="dot" style="${on ? `background:${colorOf(k)}` : ""}"></span>${esc(r.short)}</button>`;
  }).join("");
}

function toggleHighlight(k) {
  if (highlight[k] != null) delete highlight[k];
  else {
    const used = new Set(Object.values(highlight));
    const free = SLOTS.findIndex((_, i) => !used.has(i));
    if (free < 0) { alert(`한 번에 최대 ${MAX_HIGHLIGHT}팀까지 강조할 수 있어요. 다른 팀을 먼저 꺼주세요.`); return; }
    highlight[k] = free;
  }
  save(LS.hl, highlight);
  renderLegend();
  drawChart();
}

/* ---------- ranking ---------- */

function render(map) {
  const rows = REPOS.map(r => ({ ...r, stars: map[KEY(r)] }))
                    .sort((a, b) => (b.stars ?? -1) - (a.stars ?? -1) || a.title.localeCompare(b.title, "ko"));
  const max = Math.max(1, ...rows.map(r => r.stars || 0));
  let total = 0, gained = 0, rank = 0, prev = null;

  $("list").innerHTML = rows.map((r, i) => {
    if (r.stars !== prev) { rank = i + 1; prev = r.stars; }
    const key = KEY(r);
    const d = r.stars != null ? gained24h(key) : 0;
    if (r.stars != null) { total += r.stars; gained += d; }
    const changed = last[key] != null && r.stars !== last[key];
    return `
      <a class="row r${rank}${changed ? " flash" : ""}" href="https://github.com/${esc(r.repo)}" target="_blank" rel="noopener">
        <div class="rank">${rank}</div>
        <div>
          <div class="title">${esc(r.title)} <span class="team">· ${esc(r.team)}</span></div>
          <div class="repo">${esc(r.repo)}</div>
        </div>
        <div class="bar"><i style="width:${((r.stars || 0) / max) * 100}%"></i></div>
        <div class="stars">★ ${r.stars ?? "?"}<span class="delta">${d > 0 ? "+" + d : d < 0 ? d : ""}</span></div>
      </a>`;
  }).join("");

  for (const r of rows) last[KEY(r)] = r.stars;
  $("total").textContent = "★ " + total;
  const top = rows.filter(r => r.stars === rows[0].stars);
  $("leader").textContent = top.length > 1 ? `${top.length}팀 공동 (★ ${rows[0].stars})` : `${rows[0].title} (★ ${rows[0].stars})`;
  $("gained").textContent = (gained > 0 ? "+" : "") + gained;

  // first visit: highlight the current top 5 (colors then stay with those repos)
  if (!highlight) {
    highlight = {};
    rows.slice(0, 5).forEach((r, i) => { highlight[KEY(r)] = i; });
    save(LS.hl, highlight);
  }
}

function showError(msg) { $("err").textContent = msg; $("err").style.display = "block"; }

async function refresh() {
  const btn = $("refresh");
  btn.disabled = true;
  try {
    if (!REPOS.length) await loadRepos();
    const [live] = await Promise.all([fetchStars(), loadShared()]);
    current = live;
    const now = Date.now();
    recordLocal(current, now);
    render(current);
    renderLegend();
    drawChart();
    $("err").style.display = "none";
    $("updated").textContent = "마지막 업데이트: " + new Date(now).toLocaleTimeString("ko-KR");
  } catch (e) {
    showError("조회 실패 — " + e.message + " (잠시 후 다시 시도해 주세요)");
  } finally {
    btn.disabled = false;
  }
}

function schedule() {
  clearInterval(timer);
  const sec = +$("interval").value;
  if (sec > 0) timer = setInterval(refresh, sec * 1000);
}

$("refresh").addEventListener("click", refresh);
$("interval").addEventListener("change", schedule);
$("legend").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) toggleHighlight(b.dataset.k); });
$("ranges").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  range = +b.dataset.range;
  document.querySelectorAll("#ranges button").forEach(x => x.classList.toggle("on", x === b));
  drawChart();
});
$("chart").addEventListener("mousemove", onHover);
$("chart").addEventListener("mouseleave", hideTip);
window.addEventListener("resize", () => drawChart());

refresh();
schedule();
</script>
</body>
</html>
